<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Révision - Mon Anki</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            max-width: 850px;

            margin: 35px auto;

            padding: 0 20px;

            color: #222;

        }


        .top {

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .progress {

            color: #666;

        }


        .card {

            border: 1px solid #ccc;

            border-radius: 12px;

            padding: 45px 25px;

            margin: 25px 0;

            text-align: center;

            min-height: 180px;

            display: flex;

            flex-direction: column;

            justify-content: center;

        }


        .question {

            font-size: 34px;

            font-weight: bold;

        }


        .answer {

            font-size: 28px;

            margin-top: 25px;

            color: #444;

        }


        .meta {

            margin-top: 15px;

            color: #777;

            font-size: 14px;

        }


        .writing-area {

            margin-top: 30px;

        }


        #answer-input {

            padding: 14px;

            font-size: 22px;

            width: min(500px, 90%);

            border: 1px solid #bbb;

            border-radius: 7px;

        }


        .drawing-area {

            margin-top: 30px;

        }


        .reference-drawing {

            display: block;

            max-width: min(500px, 90%);

            max-height: 320px;

            margin: 20px auto 0 auto;

            border: 2px solid #bbb;

            border-radius: 8px;

            background: white;

        }


        #drawing-canvas {

            display: block;

            width: min(700px, 100%);

            height: 320px;

            margin: 0 auto 15px auto;

            border: 2px solid #bbb;

            border-radius: 8px;

            background: white;

            touch-action: none;

            cursor: crosshair;

        }


        .drawing-controls {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 5px;

        }


        button {

            padding: 12px 18px;

            margin: 5px;

            border: 1px solid #ccc;

            border-radius: 7px;

            background: white;

            cursor: pointer;

        }


        button:hover {

            background: #f2f2f2;

        }


        .answer-buttons {

            display: flex;

            justify-content: center;

            gap: 6px;

            flex-wrap: wrap;

        }


        .answer-buttons button {

            min-width: 120px;

            font-weight: bold;

        }


        .rating-delay {

            display: block;

            font-size: 12px;

            font-weight: normal;

            color: #777;

            margin-top: 4px;

        }


        .correct {

            color: #39833d;

            font-size: 20px;

            margin-top: 15px;

        }


        .incorrect {

            color: #a33;

            font-size: 18px;

            margin-top: 15px;

        }


        .completion {

            text-align: center;

            padding: 50px 0;

        }


        .hidden {

            display: none !important;

        }

    </style>

</head>


<body>


<div class="top">

    <a href="index.html">
        ← Accueil
    </a>

    <div
        id="progress"
        class="progress"
    ></div>

</div>



<div
    id="card"
    class="card"
>

    <div
        id="question"
        class="question"
    ></div>


    <div
        id="answer"
        class="answer hidden"
    ></div>


    <img
        id="reference-drawing"
        class="reference-drawing hidden"
        alt="Dessin de référence"
    >


    <div
        id="writing-area"
        class="writing-area hidden"
    >

        <input
            id="answer-input"
            type="text"
            autocomplete="off"
            placeholder="Tape ta réponse"
        >

    </div>


    <div
        id="drawing-area"
        class="drawing-area hidden"
    >

        <canvas
            id="drawing-canvas"
            width="1000"
            height="450"
        >
            Ton navigateur ne prend pas en charge le dessin.
        </canvas>


        <div class="drawing-controls">

            <button id="clear-drawing">
                Effacer
            </button>

        </div>

    </div>


    <div id="result"></div>


    <div
        id="meta"
        class="meta"
    ></div>

</div>



<div
    id="show-area"
    style="text-align:center"
>

    <button id="show-answer">
        Voir la réponse
    </button>

</div>



<div
    id="rating-area"
    class="answer-buttons hidden"
>

    <button data-rating="again">

        Again

        <span
            id="again-delay"
            class="rating-delay"
        ></span>

    </button>


    <button data-rating="hard">

        Hard

        <span
            id="hard-delay"
            class="rating-delay"
        ></span>

    </button>


    <button data-rating="good">

        Good

        <span
            id="good-delay"
            class="rating-delay"
        ></span>

    </button>


    <button data-rating="easy">

        Easy

        <span
            id="easy-delay"
            class="rating-delay"
        ></span>

    </button>

</div>



<div
    style="text-align:center; margin-top:15px;"
>

    <button id="skip-button">
        Passer
    </button>


    <button
        id="undo-button"
        class="hidden"
    >
        ↩️ Annuler la dernière réponse
    </button>

</div>



<div
    id="completion"
    class="completion hidden"
>

    <h1>
        Session terminée
    </h1>


    <p id="completion-text"></p>


    <a href="index.html">

        <button>
            Retour à l'accueil
        </button>

    </a>

</div>



<script src="JS/flashcards.js"></script>

</body>

</html>
