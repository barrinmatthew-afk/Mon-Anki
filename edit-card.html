<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modifier une carte — Mon Anki</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:850px;margin:32px auto;padding:0 18px;color:#1f2937;background:#f8fafc}header,.editor{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:22px;margin-bottom:18px}h1{font-size:26px;margin:0 0 8px}h2{font-size:19px;margin:0 0 6px}p{color:#64748b}.field{display:block;margin:16px 0;font-weight:650}.field span{display:block;margin-bottom:6px}.field textarea{width:100%;min-height:70px;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button,a.button{font:inherit;font-weight:650;padding:10px 15px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#1f2937;cursor:pointer;text-decoration:none}button.primary{background:#1f2937;color:white;border-color:#1f2937}#status{font-weight:600;white-space:pre-wrap}.muted{font-size:14px}
</style>
<style id="mon-anki-full-redesign">
:root{color-scheme:light;--ma-bg:#f4f6fb;--ma-panel:#fff;--ma-ink:#182235;--ma-muted:#66738a;--ma-line:#e0e6f0;--ma-accent:#3156b8;--ma-soft:#edf2ff;--ma-shadow:0 12px 34px rgba(26,42,75,.065)}
*{box-sizing:border-box}
html{min-height:100%;background:var(--ma-bg)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;color:var(--ma-ink)!important;background:var(--ma-bg)!important;line-height:1.55!important}
h1,h2,h3{color:var(--ma-ink);letter-spacing:-.035em}
h1{font-size:clamp(26px,4vw,36px)!important;line-height:1.15!important}
h2{font-size:clamp(18px,2.5vw,22px)}
p{line-height:1.6}
a{color:var(--ma-accent)}
button,input,textarea,select{font:inherit}
button{border:1px solid #d4ddeb!important;border-radius:10px!important;padding:10px 14px!important;background:#fff!important;color:#26344b!important;font-weight:650!important;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
button:hover:not(:disabled){background:#edf2ff!important;border-color:#a8baf1!important}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.5;cursor:not-allowed}
input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=range]),textarea,select{max-width:100%;border:1px solid #d4ddeb!important;border-radius:10px!important;padding:11px 12px!important;background:#fff;color:var(--ma-ink)}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid #c9d7ff;outline-offset:2px}
section,.panel,.editor,.import-area,.deck-area,#settings,.metric,.completion{border-color:var(--ma-line)!important;border-radius:16px!important;box-shadow:var(--ma-shadow)}
table{border-collapse:separate!important;border-spacing:0!important;overflow:hidden;border:1px solid var(--ma-line);border-radius:12px;background:#fff}
th{background:#f0f3f9!important;color:#344256;font-weight:750}
th,td{border-color:#e7ebf3!important;padding:11px 12px!important}
tr:last-child td{border-bottom:0}
.back-link,#back-link,.top>a,.top a{color:#344256!important;text-decoration:none!important;border:1px solid var(--ma-line)!important;border-radius:10px!important;background:#fff!important;padding:9px 12px!important;font-weight:650}
.status,[role=status]{overflow-wrap:anywhere}
@media(max-width:650px){body{margin:0 auto!important;padding:16px!important}table{display:block;max-width:100%;overflow-x:auto}th,td{padding:9px!important}button{max-width:100%}}
</style>
</head>
<body>
<header><h1>Modifier une carte</h1><p id="deck-info">Chargement de la carte…</p><p class="muted">Cette page est ouverte dans un nouvel onglet. Les champs de progression et les échéances de révision ne sont pas modifiés.</p></header>
<form class="editor" id="card-form"><div id="fields"></div><div class="actions"><button class="primary" type="submit">Enregistrer les modifications</button><button type="button" id="reload">Annuler les modifications</button><a class="button" href="index.html">Retour à Mon Anki</a></div><p id="status" role="status"></p></form>
<script type="module">
const params = new URLSearchParams(location.search);
const deckName = params.get("deck");
const cardIndex = Number(params.get("index"));
const fieldsRoot = document.getElementById("fields");
const status = document.getElementById("status");
const fieldNames = [
  ["word","Mot / recto"],["answer","Réponse / verso"],["question","Question"],
  ["translation","Traduction"],["front","Recto"],["back","Verso"],["meaning","Sens"],
  ["expression","Expression"],["example","Exemple"],["notes","Notes"],["hint","Indice"]
];
function getDecks(){try{return JSON.parse(localStorage.getItem("decks")||"[]")}catch{return []}}
function getCard(){const decks=getDecks();const deck=decks.find(item=>item.name===deckName);return deck&&Array.isArray(deck.cards)?{decks,deck,card:deck.cards[cardIndex]}:null}
function render(){
  fieldsRoot.replaceChildren();
  const found=getCard();
  if(!found||!found.card){document.getElementById("deck-info").textContent="Carte introuvable. Retourne à la recherche et ouvre-la à nouveau.";document.querySelector("button[type=submit]").disabled=true;return}
  document.getElementById("deck-info").textContent="Deck : "+deckName+" · Carte "+(cardIndex+1);
  let count=0;
  for(const [key,labelText] of fieldNames){
    if(typeof found.card[key]!=="string") continue;
    count++;
    const label=document.createElement("label");label.className="field";
    const caption=document.createElement("span");caption.textContent=labelText;
    const input=document.createElement("textarea");input.value=found.card[key];input.dataset.field=key;input.rows=input.value.length>100?4:2;
    label.append(caption,input);fieldsRoot.append(label);
  }
  if(!count){fieldsRoot.textContent="Aucun champ texte reconnu dans cette carte.";document.querySelector("button[type=submit]").disabled=true}
}
document.getElementById("reload").addEventListener("click",()=>{status.textContent="";render()});
document.getElementById("card-form").addEventListener("submit",async event=>{
  event.preventDefault();
  const found=getCard();
  if(!found||!found.card){status.textContent="Carte introuvable. Aucune modification enregistrée.";return}
  document.querySelectorAll("[data-field]").forEach(input=>{found.card[input.dataset.field]=input.value});
  localStorage.setItem("decks",JSON.stringify(found.decks));
  window.dispatchEvent(new CustomEvent("decksUpdated",{detail:{source:"local"}}));
  status.textContent="✓ Modifications enregistrées sur cet appareil.";
  try{
    const firebase=await import("./JS/firebase.js");
    await firebase.saveDecksToCloud(found.decks);
    status.textContent="✓ Modifications enregistrées et synchronisées.";
  }catch(error){
    console.warn("Synchronisation cloud non disponible :",error);
    status.textContent="✓ Enregistré sur cet appareil. La synchronisation cloud n’a pas pu être confirmée.";
  }
});
render();
</script>
</body>
</html>
