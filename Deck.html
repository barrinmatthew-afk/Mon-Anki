<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gérer le deck - Mon Anki</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            max-width: 1100px;

            margin: 35px auto;

            padding: 0 20px;

            color: #222;

        }


        .top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 10px;

        }


        #deck-title {

            margin-bottom: 5px;

        }


        #deck-subtitle {

            color: #666;

            margin-bottom: 25px;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 10px;

        }


        th,
        td {

            border: 1px solid #ccc;

            padding: 8px;

            text-align: left;

            vertical-align: middle;

        }


        th {

            background: #f5f5f5;

        }


        td input[type="text"] {

            width: calc(100% - 16px);

            padding: 6px;

            font-size: 15px;

            border: 1px solid #bbb;

            border-radius: 5px;

        }


        button {

            padding: 9px 14px;

            margin: 3px;

            border: 1px solid #ccc;

            border-radius: 7px;

            background: white;

            cursor: pointer;

        }


        button:hover {

            background: #f2f2f2;

        }


        .type-cell {

            width: 90px;

            text-align: center;

            color: #666;

            font-size: 14px;

        }


        .actions-cell {

            width: 190px;

            text-align: center;

            white-space: nowrap;

        }


        .save-button {

            color: #2a6b2a;

        }


        .delete-button {

            color: #a33;

        }


        .drawing-cell {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 6px;

        }


        .drawing-cell img {

            max-width: 160px;

            max-height: 100px;

            border: 1px solid #bbb;

            border-radius: 6px;

            background: white;

        }


        .drawing-cell button {

            font-size: 13px;

            padding: 6px 10px;

        }


        .row-status {

            font-size: 13px;

            color: #2a6b2a;

            margin-left: 6px;

        }


        .empty-message {

            color: #777;

            text-align: center;

            padding: 30px;

        }

    </style>

</head>


<body>


<div class="top">

    <a href="index.html">
        ← Accueil
    </a>

</div>


<h1 id="deck-title">Deck</h1>

<p id="deck-subtitle"></p>


<table>

    <thead>

        <tr>

            <th>Question</th>

            <th>Réponse</th>

            <th class="type-cell">Type</th>

            <th class="actions-cell">Actions</th>

        </tr>

    </thead>


    <tbody id="cards-table">

        <tr id="empty-row">

            <td
                colspan="4"
                class="empty-message"
            >
                Ce deck ne contient aucune carte.
            </td>

        </tr>

    </tbody>

</table>


<script src="JS/deck.js"></script>

</body>

</html>
