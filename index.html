<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon Anki</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .deck {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .deck-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .deck-name {
            font-size: 22px;
            font-weight: bold;
        }

        .deck-info {
            color: #666;
            margin-top: 8px;
        }

        .due-count {
            font-weight: bold;
            margin-top: 5px;
        }

        .nothing-due {
            color: #4b8a4b;
        }

        .deck-actions {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }

        button {
            padding: 10px 16px;
            margin: 5px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
        }

        button:hover {
            background: #f2f2f2;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .delete-button {
            background: #eee;
        }

        #create-deck-section {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        #new-deck-name {
            padding: 10px;
            font-size: 16px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .main-actions {
            margin-top: 30px;
        }

        .empty {
            color: #666;
        }

        /* =========================
           FORECAST
        ========================= */

        #forecast-section {
            margin-top: 35px;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        #forecast-section h2 {
            margin-top: 0;
        }

        .forecast-subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        #forecast-chart {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 220px;
            padding: 20px 10px 0;
            border-bottom: 1px solid #ccc;
            overflow-x: auto;
        }

        .forecast-column {
            min-width: 28px;
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        .forecast-bar-container {
            height: 180px;
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .forecast-bar {
            width: 22px;
            min-height: 2px;
            background: #555;
            border-radius: 4px 4px 0 0;
            transition: height 0.2s ease;
        }

        .forecast-number {
            font-size: 12px;
            color: #555;
            margin-bottom: 4px;
            min-height: 15px;
        }

        .forecast-hour {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            white-space: nowrap;
        }

        .forecast-empty {
            color: #666;
            text-align: center;
            padding: 30px 0;
        }

    </style>

</head>

<body>

    <h1>Mon Anki</h1>

    <p class="subtitle">
        Choisis un deck à étudier.
    </p>

    <div id="decks-container"></div>

    <div id="forecast-section">

        <h2>Cartes à venir</h2>

        <p class="forecast-subtitle">
            Cartes qui deviendront disponibles au cours des prochaines heures.
        </p>

        <div id="forecast-chart"></div>

    </div>

    <div id="create-deck-section">

        <h2>Créer un deck</h2>

        <input
            type="text"
            id="new-deck-name"
            placeholder="Nom du deck"
        >

        <button id="create-deck">
            Créer
        </button>

    </div>

    <div class="main-actions">

        <a href="import.html">
            <button>
                Importer du vocabulaire
            </button>
        </a>

    </div>

    <script src="JS/script.js"></script>

</body>

</html>
