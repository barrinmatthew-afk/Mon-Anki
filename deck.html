<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gérer le deck - Mon Anki</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            max-width: 1100px;

            margin: 35px auto;

            padding: 0 20px;

            color: #222;

        }


        .top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 10px;

        }


        #deck-title {

            margin-bottom: 5px;

        }


        #deck-subtitle {

            color: #666;

            margin-bottom: 25px;

        }


        #add-card-section {

            margin-bottom: 25px;

            padding: 18px;

            border: 1px solid #ddd;

            border-radius: 10px;

        }


        #add-card-section h2 {

            margin-top: 0;

        }


        #add-card-section input {

            padding: 8px;

            font-size: 15px;

            border: 1px solid #bbb;

            border-radius: 5px;

            margin-right: 5px;

            width: 220px;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 10px;

        }


        th,
        td {

            border: 1px solid #ccc;

            padding: 8px;

            text-align: left;

            vertical-align: middle;

        }


        th {

            background: #f5f5f5;

        }


        td input[type="text"] {

            width: calc(100% - 16px);

            padding: 6px;

            font-size: 15px;

            border: 1px solid #bbb;

            border-radius: 5px;

        }


        button {

            padding: 9px 14px;

            margin: 3px;

            border: 1px solid #ccc;

            border-radius: 7px;

            background: white;

            cursor: pointer;

        }


        button:hover {

            background: #f2f2f2;

        }


        .type-cell {

            width: 90px;

            text-align: center;

            color: #666;

            font-size: 14px;

        }


        .actions-cell {

            width: 190px;

            text-align: center;

            white-space: nowrap;

        }


        .save-button {

            color: #2a6b2a;

        }


        .delete-button {

            color: #a33;

        }


        .drawing-cell {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 6px;

        }


        .drawing-cell img {

            max-width: 160px;

            max-height: 100px;

            border: 1px solid #bbb;

            border-radius: 6px;

            background: white;

        }


        .drawing-cell button {

            font-size: 13px;

            padding: 6px 10px;

        }


        .row-status {

            font-size: 13px;

            color: #2a6b2a;

            margin-left: 6px;

        }


        .empty-message {

            color: #777;

            text-align: center;

            padding: 30px;

        }


        #sync-status {

            color: #666;

            margin-top: 15px;

        }


        /* =========================
           EDITEUR DE DESSIN
        ========================= */

        #drawing-editor {

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.55);

            display: none;

            align-items: center;

            justify-content: center;

            z-index: 1000;

            padding: 20px;

            box-sizing: border-box;

        }


        #drawing-editor.visible {

            display: flex;

        }


        #drawing-editor-content {

            background: white;

            border-radius: 12px;

            padding: 20px;

            max-width: 900px;

            width: 100%;

            max-height: 95vh;

            overflow: auto;

            box-sizing: border-box;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);

        }


        #drawing-editor-content h2 {

            margin-top: 0;

            margin-bottom: 8px;

        }


        #drawing-editor-help {

            color: #666;

            margin-top: 0;

        }


        #drawing-canvas {

            display: block;

            width: 100%;

            max-height: 65vh;

            border: 1px solid #bbb;

            border-radius: 8px;

            background: white;

            cursor: crosshair;

            touch-action: none;

        }


        .drawing-editor-buttons {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 6px;

            margin-top: 12px;

        }


        .drawing-editor-buttons button {

            min-width: 130px;

        }


        #save-drawing-button {

            color: #2a6b2a;

        }


        #cancel-drawing-button {

            color: #a33;

        }

    </style>

</head>


<body>


<div class="top">

    <a href="index.html">
        ← Accueil
    </a>

</div>


<h1 id="deck-title">
    Deck
</h1>


<p id="deck-subtitle"></p>


<!-- =========================
     AJOUTER UNE CARTE
========================= -->

<div id="add-card-section">

    <h2>
        Ajouter une carte
    </h2>


    <input
        type="text"
        id="new-question"
        placeholder="Question"
    >


    <input
        type="text"
        id="new-answer"
        placeholder="Réponse"
    >


    <button id="add-card-button">

        ➕ Ajouter

    </button>


    <p id="sync-status"></p>

</div>


<!-- =========================
     CARTES
========================= -->

<table>

    <thead>

        <tr>

            <th>
                Question
            </th>

            <th>
                Réponse
            </th>

            <th class="type-cell">
                Type
            </th>

            <th class="actions-cell">
                Actions
            </th>

        </tr>

    </thead>


    <tbody id="cards-table">

        <tr id="empty-row">

            <td
                colspan="4"
                class="empty-message"
            >

                Ce deck ne contient aucune carte.

            </td>

        </tr>

    </tbody>

</table>


<!-- =========================
     EDITEUR DE DESSIN
========================= -->

<div id="drawing-editor">

    <div id="drawing-editor-content">

        <h2>
            Modifier le dessin
        </h2>


        <p id="drawing-editor-help">

            Dessine directement sur le dessin existant.

        </p>


        <canvas
            id="drawing-canvas"
            width="1000"
            height="700"
        ></canvas>


        <div class="drawing-editor-buttons">

            <button
                type="button"
                id="clear-drawing-button"
            >
                🗑️ Effacer
            </button>


            <button
                type="button"
                id="reset-drawing-button"
            >
                ↩️ Réinitialiser
            </button>


            <button
                type="button"
                id="cancel-drawing-button"
            >
                Annuler
            </button>


            <button
                type="button"
                id="save-drawing-button"
            >
                ✓ Enregistrer le dessin
            </button>

        </div>

    </div>

</div>


<!-- =========================
     FIREBASE + DECK
========================= -->

<script type="module">

    import {

        waitForAuth,
        syncLocalDecksWithCloud

    } from "./JS/firebase.js";


    const user =
        await waitForAuth();


    await syncLocalDecksWithCloud();


    await import("./JS/deck.js");

</script>


</body>

</html>
