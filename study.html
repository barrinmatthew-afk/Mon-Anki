<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Étudier - Mon Anki</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            max-width: 700px;

            margin: 40px auto;

            padding: 0 20px;

        }


        #back-link {

            display: inline-block;

            margin-bottom: 20px;

        }


        #deck-name {

            color: #666;

        }


        #settings {

            margin-top: 30px;

            padding: 25px;

            border: 1px solid #ccc;

            border-radius: 10px;

        }


        .setting {

            margin-bottom: 25px;

        }


        .setting-title {

            font-weight: bold;

            margin-bottom: 10px;

        }


        button {

            padding: 10px 16px;

            margin: 5px;

            cursor: pointer;

        }


        .selected {

            font-weight: bold;

            border: 2px solid black;

        }


        #start-button {

            margin-top: 20px;

            font-size: 18px;

        }


        .limit-input {

            width: 100px;

            padding: 10px;

            font-size: 18px;

            border: 1px solid #999;

            border-radius: 5px;

            box-sizing: border-box;

        }


        .limit-description {

            color: #666;

            font-size: 14px;

            margin-top: 8px;

        }


        #available-cards {

            line-height: 1.7;

        }

    
        @media (max-width: 600px) {
            body { margin: 14px auto; padding: 0 12px; font-size: 15px; }
            h1 { font-size: 26px; }
            #settings { padding: 15px; margin-top: 20px; }
            .setting { margin-bottom: 20px; }
            .setting button, #start-button { width: 100%; box-sizing: border-box; margin: 5px 0; padding: 12px; }
            .limit-input { width: 100%; max-width: 180px; }
            #back-link { margin-bottom: 12px; }
        }
    </style>

<style>
/* Interface harmonisée Mon Anki */
*{box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important;color:#182235!important;background:#f5f7fb!important;line-height:1.55}
a{color:#3156b8}
button{font:inherit;border:1px solid #d7dfec!important;border-radius:10px!important;padding:10px 14px!important;background:#fff!important;color:#26344b!important;font-weight:650;cursor:pointer;transition:background .15s,border-color .15s}
button:hover:not(:disabled){background:#eef3ff!important;border-color:#a8baf1!important}
button:disabled{opacity:.48;cursor:not-allowed}
input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=range]),textarea,select{font:inherit;border:1px solid #d7dfec!important;border-radius:10px!important;padding:10px 12px!important;max-width:100%;background:#fff;color:#182235}
h1{font-size:clamp(25px,4vw,32px);line-height:1.2;letter-spacing:-.8px;color:#182235}
h2{letter-spacing:-.25px;color:#182235}
#back-link,.back-link,.top>a,.top a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#344256;padding:8px 12px;border:1px solid #e0e6ef;border-radius:10px;background:#fff;font-weight:650}
@media(max-width:600px){body{margin:0 auto!important;padding:16px!important}button{padding:10px 12px!important}}
body{max-width:820px!important;margin:0 auto!important;padding:28px 22px 60px!important}
#deck-name{color:#64748b!important;margin:8px 0 20px}
#settings{margin-top:18px!important;padding:22px!important;border:1px solid #e1e7f0!important;border-radius:18px!important;background:#fff;box-shadow:0 10px 28px rgba(25,42,75,.05)}
.setting{padding:16px 0!important;margin:0!important;border-bottom:1px solid #edf0f6}
.setting:last-child{border-bottom:0}
.setting-title{font-size:15px!important;margin-bottom:12px!important;color:#26344b}
.selected{background:#eaf0ff!important;border:1px solid #8da7ee!important;color:#2648a5!important}
#start-button{background:#3156b8!important;color:white!important;border-color:#3156b8!important;margin-top:18px!important;font-size:16px!important}
.limit-description{color:#64748b!important}
</style>
</head>


<body>


<a
    id="back-link"
    href="index.html"
>
    ← Retour aux decks
</a>


<h1>Préparer la session</h1>


<p id="deck-name"></p>


<div id="settings">


    <!-- =========================
         DIRECTION
    ========================== -->

    <div class="setting">

        <div class="setting-title">
            Direction
        </div>


        <button id="fr-nl">
            FR → NL
        </button>


        <button id="nl-fr">
            NL → FR
        </button>


        <button id="random-direction">
            Aléatoire
        </button>

    </div>


    <!-- =========================
         MODE
    ========================== -->

    <div class="setting">

        <div class="setting-title">
            Mode
        </div>


        <button id="flashcard-mode">
            Flashcards
        </button>


        <button id="writing-mode">
            Écriture
        </button>


        <button id="drawing-mode">
            ✏️ Dessin
        </button>

    </div>


    <!-- =========================
         NOUVELLES CARTES
    ========================== -->

    <div class="setting">

        <div class="setting-title">
            Limite de nouvelles cartes
        </div>


        <input
            id="new-card-limit"
            class="limit-input"
            type="number"
            min="0"
            step="1"
            value="20"
            inputmode="numeric"
            autocomplete="off"
        >


        <div class="limit-description">
            Maximum de nouvelles cartes dans cette session.
        </div>

    </div>


    <!-- =========================
         RÉVISIONS
    ========================== -->

    <div class="setting">

        <div class="setting-title">
            Limite de cartes à revoir
        </div>


        <input
            id="review-limit"
            class="limit-input"
            type="number"
            min="0"
            step="1"
            value="50"
            inputmode="numeric"
            autocomplete="off"
        >


        <div class="limit-description">
            Maximum de cartes déjà apprises à revoir.
        </div>

    </div>


    <!-- =========================
         DISPONIBLES
    ========================== -->

    <div class="setting">

        <div class="setting-title">
            Cartes disponibles
        </div>


        <p id="available-cards">
            Calcul...
        </p>

    </div>


    <!-- =========================
         COMMENCER
    ========================== -->

    <button id="start-button">
        Commencer
    </button>


</div>


<script src="JS/study.js"></script>

</body>

</html>
